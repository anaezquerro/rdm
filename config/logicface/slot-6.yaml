data:
  mode: OL
  transform:
    input: 
      source: [img]
      img_size: [3, 128, 128]
    target:
      source: [img]
      img_size: [3, 128, 128]

optimizer:
  name: adamw
  lr: 0.0004
  batch_size: 64
  max_norm: 1.0
  ema: 0
  scheduler:
    name: slot
    warmup: 1e4
    decay: 1e5
    rate: 0.5

slot:
  img_size: [3, 128, 128]
  num_slots: 6
  iters: 3
  hidden_size: [256, 8, 8]
  encoder:
    hidden_dims: [32, 64, 128, 256]
    num_convs: 2
    norm: none
  decoder:
    hidden_dims: [256, 128, 64, 32]
    num_convs: 2
    norm: none

train:
  batch_size: 64
  max_steps: 2e5

eval:
  batch_size: 128
  
predict:
  batch_size: 128
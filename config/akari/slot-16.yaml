data:
  mode: OL
  transform:
    input: 
      source: [img]
      img_size: [3, 198, 198]
    target: 
      source: [img]
      img_size: [3, 198, 198]

optimizer:
  name: adamw
  lr: 0.0004
  batch_size: 64
  max_norm: 1.0
  ema: 0
  scheduler:
    name: slot
    warmup: 1e4
    decay: 1e5
    rate: 0.5

slot:
  img_size: [3, 198, 198]
  num_slots: 16
  iters: 3
  hidden_size: [128, 11, 11]
  encoder:
    hidden_dims: [16, 32, 64, 128]
    num_convs: 1
    norm: none
  decoder:
    num_convs: 1
    norm: none
    hidden_dims: [128, 64, 32, 16]

train:
  batch_size: 64
  max_steps: 2e5

predict:
  batch_size: 128

eval:
  batch_size: 128
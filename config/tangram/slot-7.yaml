data: 
  mode: OL
  version: full
  transform:
    input: 
      source: [img]
      img_size: [3, 128, 128]
    target:
      source: [img]
      img_size: [3, 128, 128]

optimizer:
  name: adamw
  lr: 0.0004
  batch_size: 64
  max_norm: 1.0
  ema: 0
  scheduler:
    name: slot
    warmup: 1e4
    decay: 1e5
    rate: 0.5

train:
  batch_size: 64
  max_steps: 4e5

evaluate: 
  batch_size: 128

predict:
  batch_size: 128

slot:
  img_size: [3, 128, 128]
  num_slots: 7
  iters: 3
  hidden_size: [128, 8, 8]
  encoder:
    hidden_dims: [16, 32, 64, 128]
    num_convs: 1
    norm: none 
  decoder:
    num_convs: 1
    norm: none 
    hidden_dims: [128, 64, 32, 16]

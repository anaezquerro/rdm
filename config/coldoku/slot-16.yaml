data:
  mode: OL
  colored: true 
  tilted: false
  level: [1, 81] 
  transform:
    input: 
      source: [clue]
      img_size: [3, 180, 180]
    target: 
      source: [clue]
      img_size: [3, 180, 180]

optimizer:
  name: adamw
  lr: 0.0004
  batch_size: 64
  max_norm: 1.0
  ema: 0
  scheduler:
    name: slot
    warmup: 1e4
    decay: 1e5
    rate: 0.5

slot:
  img_size: [3, 180, 180]
  num_slots: 16
  iters: 3
  hidden_size: [256, 9, 9]
  encoder: 
    hidden_dims: [32, 64, 128, 256]
    num_convs: 1
    norm: none
  decoder:
    hidden_dims: [256, 128, 64, 32]
    num_convs: 1
    norm: none

train:
  max_steps: 5e5
  batch_size: 64

eval:
  batch_size: 128

predict:
  batch_size: 128

data:
  mode: OL
  colored: true 
  tilted: false
  transform:
    input: 
      source: [img]
      img_size: [3, 180, 180]
    target: 
      source: [img]
      img_size: [3, 180, 180]

optimizer:
  name: adamw
  lr: 0.0004
  batch_size: 64
  max_norm: 1.0
  ema: 0
  scheduler:
    name: slot
    warmup: 1e4
    decay: 1e5
    rate: 0.5

slot:
  img_size: [3, 180, 180]
  num_slots: 81
  iters: 3
  hidden_size: [128, 9, 9]
  encoder: 
    hidden_dims: [16, 32, 64, 128]
    num_convs: 1
    norm: none
  decoder:
    hidden_dims: [128, 64, 32, 16]
    num_convs: 1
    norm: none
    scalable: true

train:
  batch_size: 64
  max_steps: 4e5

eval:
  batch_size: 128

predict:
  batch_size: 128